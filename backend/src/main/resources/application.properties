spring.application.name=notes-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:notes}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:notes}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Notes API
info.app.description=DevOps delivery training workload
