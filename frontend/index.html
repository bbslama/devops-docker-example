<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Docker Fullstack Demo</title>
</head>
<body>
    <h1>Direct DB Data Example</h1>
    <div id="data-container">Loading records...</div>

    <script>
        fetch('/api/data')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('data-container');
                if (data.length === 0) {
                    container.innerText = 'No data found in database.';
                    return;
                }
                container.innerHTML = `<ul>${data.map(item => `<li><strong>${item.title}</strong>: ${item.content}</li>`).join('')}</ul>`;
            })
            .catch(err => {
                document.getElementById('data-container').innerText = 'Error loading data.';
                console.error(err);
            });
    </script>
</body>
</html>
