name: CI/CD delivery pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests and quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run Maven verification
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend-test:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend quality checks
        working-directory: frontend
        run: npm run quality

  build-publish:
    name: Build, scan, and publish images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set application version
        id: version
        run: echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devops-example-backend:${{ steps.version.outputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/devops-example-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devops-example-frontend:${{ steps.version.outputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/devops-example-frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.0
      - name: Scan published images for fixable critical vulnerabilities
        env:
          BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-example-backend:${{ steps.version.outputs.version }}
          FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-example-frontend:${{ steps.version.outputs.version }}
        run: |
          blocked=false
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            printf '\n## Trivy scan: %s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
            set +e
            trivy image --ignore-unfixed --severity CRITICAL --exit-code 1 --format table "$image" 2>&1 | tee "$RUNNER_TEMP/trivy.log"
            scan_status=${PIPESTATUS[0]}
            set -e
            if [ "$scan_status" -eq 0 ]; then
              echo "PASS: no fixable critical vulnerabilities in $image"
              echo "PASS: scan completed for \`$image\`." >> "$GITHUB_STEP_SUMMARY"
            elif grep -Eiq 'failed to download.*(db|database)|unable to download.*(db|database)|failed to initialize.*(db|database)|database.*(download|unavailable)' "$RUNNER_TEMP/trivy.log"; then
              echo "BLOCKED: Trivy vulnerability database could not be downloaded for $image."
              echo "BLOCKED: Trivy vulnerability database could not be downloaded; scan did not complete for \`$image\`." >> "$GITHUB_STEP_SUMMARY"
              blocked=true
            else
              exit "$scan_status"
            fi
          done
          if [ "$blocked" = true ]; then
            exit 1
          fi
      - name: Publish scanned image tags
        env:
          BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-example-backend:${{ steps.version.outputs.version }}
          FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-example-frontend:${{ steps.version.outputs.version }}
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "${BACKEND_IMAGE%:*}:latest"
          docker push "$FRONTEND_IMAGE"
          docker push "${FRONTEND_IMAGE%:*}:latest"
      - name: Publish version summary
        run: |
          echo "## Published application version" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Temporary deployment acceptance
    runs-on: ubuntu-latest
    needs: build-publish
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      APP_VERSION: ${{ needs.build-publish.outputs.version }}
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      COMPOSE_PROJECT_NAME: devops-example-acceptance-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set temporary database password
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Pull exact published version
        run: |
          if ! docker compose -f deploy/compose.yaml pull; then
            docker compose -f deploy/compose.yaml ps
            docker compose -f deploy/compose.yaml logs --no-color
            exit 1
          fi
      - name: Start and wait for healthy deployment
        run: |
          if ! docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 180; then
            docker compose -f deploy/compose.yaml ps
            docker compose -f deploy/compose.yaml logs --no-color
            exit 1
          fi
          docker compose -f deploy/compose.yaml ps
      - name: Run deployment smoke test
        run: |
          if ! scripts/smoke-test.sh; then
            docker compose -f deploy/compose.yaml ps
            docker compose -f deploy/compose.yaml logs --no-color
            exit 1
          fi
      - name: Tear down temporary deployment
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes --remove-orphans
