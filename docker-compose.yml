services:
  frontend:
    build: ./frontend
    container_name: nginx_frontend
    ports:
      - "80:80"
    networks:
      - frontend_net
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: node_backend
    environment:
      DB_HOST: mysql_db
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: app_database
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app_database
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app_user", "-papp_password"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  db_data:

